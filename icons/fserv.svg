<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>fServe</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A1F"/>
      <stop offset="1" stop-color="#E5322D"/>
    </linearGradient>
  </defs>
  <!-- Фон на весь квадрат: лаунчер сам обрежет углы по маске (adaptive icon) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Белая окружность в центре, целиком внутри безопасной зоны adaptive icon -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="#FFFFFF" stroke-width="32"/>
</svg>
