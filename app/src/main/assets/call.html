<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Звонок</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #remote { position: fixed; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; background: #000; opacity: 0; }
  #remote.on { opacity: 1; } /* по высоте экрана, лишнее по бокам обрезается: как в окне на вкладке «Звонок» */
  #local { position: fixed; right: 14px; bottom: 14px; width: 24%; max-width: 280px; aspect-ratio: 3 / 4; object-fit: cover;
           transform: scaleX(-1); border: 2px solid rgba(255,255,255,.6); border-radius: 10px; background: #222; display: none; }
</style>
</head>
<body>
<!-- прозрачный poster: иначе WebView показывает на весь экран значок медиаплеера, пока нет кадров -->
<video id="remote" autoplay playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
<video id="local" autoplay playsinline muted poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
<script>
document.getElementById("remote").addEventListener("playing", () => document.getElementById("remote").classList.add("on"));
// Страница звонка на устройстве: отвечает на предложение (offer) администратора и показывает его видео во весь экран,
// а своё видео (с передней камеры, зеркально) в правом нижнем углу. Результат передаётся приложению через мост Android.
let pc = null, stream = null;

function report(fn, arg) { try { Android[fn](String(arg)); } catch (e) {} }

async function callAccept(offer, res) {
  try {
    const m = /^(\d+)x(\d+)$/.exec(res) || [0, "640", "480"];
    const audio = {echoCancellation: true, noiseSuppression: true, autoGainControl: true};
    const video = {facingMode: "user", width: {ideal: +m[1]}, height: {ideal: +m[2]}};
    // если не удаётся взять и звук, и видео, звонок идёт с тем, что получилось (причина пишется в журнал приложения)
    const tries = [["звук и видео", {audio, video}], ["звук без настроек и видео", {audio: true, video}], ["только видео", {video}], ["только звук", {audio: true}]];
    let last = "";
    for (const [name, c] of tries) {
      try {
        stream = await navigator.mediaDevices.getUserMedia(c);
        if (last) report("warn", "захват: " + name + " (первая попытка не удалась: " + last + ")");
        break;
      } catch (e) { last = (e && e.name ? e.name + ": " + e.message : String(e)); }
    }
    if (!stream) throw new Error(last);
    if (stream.getVideoTracks().length) {
      document.getElementById("local").srcObject = stream;
      document.getElementById("local").style.display = "block";
    }
    pc = new RTCPeerConnection({iceServers: []}); // сеть локальная: достаточно прямых адресов
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
    pc.ontrack = e => {
      const r = document.getElementById("remote");
      r.srcObject = e.streams[0];
      r.play().catch(() => {});
    };
    pc.onconnectionstatechange = () => report("state", pc.connectionState);
    await pc.setRemoteDescription({type: "offer", sdp: offer});
    await pc.setLocalDescription(await pc.createAnswer());
    await new Promise(done => {
      if (pc.iceGatheringState === "complete") return done();
      const t = setTimeout(done, 3000);
      pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === "complete") { clearTimeout(t); done(); } };
    });
    report("answer", pc.localDescription.sdp);
  } catch (e) {
    report("error", (e && e.name ? e.name + ": " + e.message : e));
  }
}
</script>
</body>
</html>
