<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>fServe</title>
<style>
  html, body { margin: 0; height: 100%; background: #036; color: #e8f1ff; overflow: hidden;
    font-family: "Roboto", "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  /* нижние 24% экрана отданы под кнопку вызова */
  .wrap { height: 100%; box-sizing: border-box; padding-bottom: 24vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #time { font-weight: 100; font-size: min(32vw, 34vh); line-height: 1; letter-spacing: -0.02em; }
  #time .c { display: inline-block; animation: colon 2s ease-in-out infinite; }
  @keyframes colon { 0%, 100% { opacity: 1; } 50% { opacity: .12; } }
  #date { font-weight: 300; font-size: min(7vw, 8vh); margin-top: 3vh; opacity: .9; }
  #day  { font-weight: 300; font-size: min(7vw, 8vh); margin-top: 1vh; opacity: .9; }
  #call { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%);
    width: min(22vw, 18vh); height: min(22vw, 18vh); border-radius: 50%; border: 0; padding: 0;
    background: #d32f2f; box-shadow: 0 0.6vh 2vh rgba(0,0,0,.4); display: none; }
  #call svg { width: 55%; height: 55%; fill: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div id="time"><span id="hh">--</span><span class="c">:</span><span id="mm">--</span></div>
  <div id="date"></div>
  <div id="day"></div>
</div>

<!-- Кнопка вызова скрыта, пока звонок не включён (позже: ?call=1 или флаг из настроек) -->
<button id="call" aria-label="Позвонить">
  <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
</button>

<script>
  // Названия заданы явно: не зависим от языка и ICU устройства.
  var MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var DAYS = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function tick() {
    var d = new Date();
    document.getElementById("hh").textContent = pad(d.getHours());
    document.getElementById("mm").textContent = pad(d.getMinutes());
    document.getElementById("date").textContent = d.getDate() + " " + MONTHS[d.getMonth()];
    document.getElementById("day").textContent = DAYS[d.getDay()];
  }
  tick();
  setInterval(tick, 1000);
  if (/[?&]call=1/.test(location.search)) document.getElementById("call").style.display = "block";
</script>
</body>
</html>
