<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>fServe.Kiosk</title>
<style>
  html, body { margin: 0; height: 100%; background: #036; color: #e8f1ff; overflow: hidden;
    font-family: "Roboto", "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  .wrap { height: 100%; box-sizing: border-box; padding-bottom: 14vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #time { font-weight: 100; font-size: 30vh; font-size: min(32vw, 34vh); line-height: 1; letter-spacing: -0.02em; }
  #time .c { display: inline-block; animation: colon 2s ease-in-out infinite;}
  @keyframes colon { 0%, 100% { opacity: .9; } 50% { opacity: .1; } }
  #date { font-weight: 300; font-size: 8vh; font-size: min(8vw, 10vh); margin-top: 10vh; opacity: .9; color: #39c;}
  #day  { font-weight: 300; font-size: 8vh; font-size: min(8vw, 10vh); margin-top: 1vh; opacity: .9; color: #39c;}
  #day.weekend {color: #c93;}
  #wx { position: absolute; top: 3vh; left: 0; right: 0; text-align: center; font-weight: 300; font-size: 6vh; font-size: min(5vw, 6vh); color: #7ab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3vw; }
  #wx .i { margin-right: .4em; }
</style>
</head>
<body>
<div id="wx" style="display:none"><span class="i" id="wxi"></span><span id="wxt"></span></div>
<div class="wrap">
  <div id="time"><span id="hh">--</span><span class="c">:</span><span id="mm">--</span></div>
  <div id="date"></div>
  <div id="day"></div>
</div>

<script>
  var MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var DAYS = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function tick() {
    var d = new Date();
    var day = d.getDay();
    document.getElementById("hh").textContent = pad(d.getHours());
    document.getElementById("mm").textContent = pad(d.getMinutes());
    document.getElementById("date").textContent = d.getDate() + " " + MONTHS[d.getMonth()];
    document.getElementById("day").textContent = DAYS[day];
    document.getElementById("day").classList.toggle('weekend', day === 0 || day === 6);
  }
  tick();
  setInterval(tick, 1000);

  // погода: строка сверху по центру; пока данных нет (или погода выключена в настройках) строка скрыта
  function weather() {
    var next = 30000;
    var x = new XMLHttpRequest();
    x.open("GET", "/api/weather");
    x.timeout = 10000;
    x.onload = function () {
      try {
        var w = JSON.parse(x.responseText);
        var box = document.getElementById("wx");
        if (w.enabled && w.available) {
          document.getElementById("wxi").textContent = w.icon;
          document.getElementById("wxt").textContent = w.text;
          box.style.display = "";
          next = 600000;
        } else {
          box.style.display = "none";
          next = w.enabled ? 30000 : 600000;
        }
      } catch (e) { /* ответ непонятен: попробуем позже */ }
    };
    x.onloadend = function () { setTimeout(weather, next); };
    x.send();
  }
  weather();
</script>
</body>
</html>
