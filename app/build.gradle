plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Passed by CI:  -PappVersionName=1.2.3 -PappVersionCode=1002003
def vName = project.findProperty('appVersionName') ?: '0.0.0-dev'
def vCode = (project.findProperty('appVersionCode') ?: '1') as int

android {
    namespace 'com.ffps.fserv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ffps.fserv'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName
        // 64- и 32-разрядные ARM: нативные библиотеки нейроголоса большие, x86 не нужен
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 пока выключен: меньше сюрпризов на первых сборках. Включим, когда проект устоится.
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    testOptions { unitTests.returnDefaultValues = true }

    lint { abortOnError false; checkReleaseBuilds false; checkOnly 'NewApi', 'InlinedApi'; xmlReport true; htmlReport false }
}

dependencies {
    // Встроенный HTTP-сервер (веб-интерфейс и API)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Собственный HTTP-клиент: платформенный в Android 8.0 падает с NullPointerException при закрытии соединения
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Офлайн-распознавание коротких ответов (шаг ask); модель речи скачивается отдельно, см. Stt.kt
    implementation 'com.alphacephei:vosk-android:0.3.47'

    // Офлайн-нейроголос Piper (sherpa-onnx). AAR скачивает CI в app/libs (см. .github/workflows/release.yml), в репозитории его нет
    implementation files('libs/sherpa-onnx-2.0.1.aar')
    implementation 'com.github.csukuangfj.piper-phonemize:piper-phonemize:v1.5.9'
    // распаковка tar.bz2 с моделью голоса
    implementation 'org.apache.commons:commons-compress:1.26.2'

    // Тесты логики (длительности, условия, схема задач) выполняются на обычной JVM
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
